services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # Resolved relative to this file's directory (docker/), so this finds the repo-root
    # .env regardless of the directory `docker compose` is invoked from — unlike the
    # `--env-file` CLI flag, which is resolved relative to the current directory instead.
    env_file:
      - ../.env
    environment:
      # Deployment-fixed values — always production inside the container, no matter
      # what NODE_ENV happens to be set to in the local .env used for `npm run start:dev`.
      PORT: 3000
      NODE_ENV: production
    volumes:
      - sessions_data:/app/sessions
      - media_data:/app/media
    ports:
      - "${PORT:-3000}"
    networks:
      - whatsapp-bot-net

networks:
  whatsapp-bot-net:
    external: true

volumes:
  sessions_data:
  media_data:
